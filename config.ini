# config.ini - ATE-2704 dual-region upgrade lab
# Version 2.5 - 2026-11-10
# Initial template: Burke Azbill, Ben Sier and HOL Core Team
#
# Changes in 2.5:
#   - Site B workload domain is now vCenter / ESX 8.0 U3i with Supervisor
#     v1.32.9, Supervisor Services Contour, Harbor, Local Consumption
#     Interface and Argo CD, the VKS cluster vks-demo/vks-01 (v1.32.10) and
#     the example voting app (deployed by Argo CD from Gitea).
#   - Gitea (offlinedepot:3000) and the offline Supervisor/VKS library
#     (offlinedepot:8080) added to TCPServices and URLS.
#   - [VPOD] new-dns-records for harbor, vks-01, argocd, vote, result.
#   - [VCFFINAL] supervisor_services, k8s_urls, k8s_wait_minutes,
#     k8s_required, vks_unpause for the VCFfinal override v1.4.
#
# Baseline: Region A standalone vSphere 8.0 U3; Site B VCF 5.2.1 and a
# separate vSphere 8.0 U3 workload cluster. Students perform the 9.1.1 upgrades.
# This file is copied to /tmp/config.ini by labstartup.sh.
# Preserve the option spelling and the indentation of multiline values.
#
# Changes in 2.4:
#   - demo-002 (Aria Automation demo VM) started by vSphere.py ([RESOURCES]
#     VMs) and shut down in Phase 4 ([SHUTDOWN] workload_vms).
#   - Removed the SDDC Manager ping (10.2.1.5): the VM is started after the
#     ping checks; sddcmanager-b:443 in TCPServices covers it.
#   - VCFfinal override v1.3 enables vCenter SSH ([VCFFINAL] vcenter_ssh).
#
# Changes in 2.3:
#   - [VCFFINAL] vra_start_hosts / vra_node_wait_minutes: VCFfinal override
#     starts the Aria Automation services (deploy.sh) after a clean shutdown.
#   - Removed auto-01b:443 from TCPServices (closed until deploy.sh finishes;
#     checked by [VCFFINAL] vraurls instead). vraurl_wait_minutes 35 -> 60.
#   - [VPOD] maxminutes 60 -> 90: the overall limit also caps the Aria wait.
#
# Changes in 2.2:
#   - [SHUTDOWN] vra_prep_hosts / vra_prep_timeout for the Shutdown/Shutdown.py
#     wrapper: stop Aria Automation services (deploy.sh --shutdown) first.
#
# Changes in 2.1:
#   - Added Workspace ONE Access (vidm-01b) and Aria Automation 8.18.1
#     (auto-01b) on the Site B x-region network: startup, shutdown, checks.
#   - Added ping/TCP/URL checks for Aria Suite Lifecycle, vIDM, Aria
#     Automation, the workload NSX Manager, the x-region gateway and authentik.
#   - Documented the Site B workload Supervisor (see [VCF] and [SHUTDOWN]).
#
# Startup dependency order, using the installed HOL core modules:
#   1. Router/Manager and outer ESX VMs boot through the vApp power-on policy.
#   2. ESXi.py checks all 12 hosts; VCF.py exits maintenance mode and waits
#      for the three vSAN datastores through direct ESXi connections.
#   3. VCF.py boots both NSX Managers and the four NSX Edges, then the Site B
#      Aria VMs on the x-region network (Suite Lifecycle, Workspace ONE
#      Access, Automation), then the three vCenter appliances.
#   4. vSphere.py waits for vCenter services, then boots SDDC Manager B
#      and the two Region A user VMs in the order listed below.
#      vCenter (ESX Agent Manager) starts the Supervisor control plane VMs.
#   5. Ping, TCP and URL checks verify the deployed environment.
#
#   6. VCFfinal.py - this repo's override, Startup/VCFfinal.py - waits for the
#      Supervisor and for Aria Automation (see [VCFFINAL]).
#
# [VCFFINAL] is used together with the lab-specific Startup/VCFfinal.py.
# The core VCFfinal.py would also run VCF 9.x tasks (WCP/Supervisor tuning,
# NSX password policy changes, Vault CA distribution via confighol-9.1.py)
# that are not suitable for this 8.x / 5.2.1 baseline; the override runs only
# the Supervisor and Aria Automation checks. Do not delete the override while
# [VCFFINAL] exists.
#
# Do not add future Operations, VSP or licensing VMs until those components
# have actually been deployed. Refresh this baseline configuration after the
# lab's upgrade exercises if needed.

[VPOD]
vPod_SKU = ATE-2704
labtype = ATE
lockholuser = false
holuser_lock = false
# Overall startup limit. Every module wait checks it, including the Aria
# Automation wait in VCFfinal: after a clean shutdown, deploy.sh needs 20-40
# min near the end of the startup, so 60 left too little margin.
maxminutes = 90
odyssey = false
conky_title = vSphere 8 / VCF 5.2.1 Upgrade Lab
ohmyposh_enabled = false
install_playwright = false
enablevscodeproxy = false

# Startup validation runs once. Periodic labcheck must not restart old
# appliances or take hosts out of maintenance during a student's upgrade.
labcheck_enabled = false

# Site B workload Supervisor endpoints (added 2026-11-10). They already exist
# on the holorouter DNS; the startup DNS import (Tools/tdns_import.py) keeps
# them in place if the router is rebuilt.
new-dns-records = site-b.vcf.lab,harbor,A,10.2.15.3
    site-b.vcf.lab,vks-01,A,10.2.15.4
    site-b.vcf.lab,argocd,A,10.2.15.5
    site-b.vcf.lab,vote,A,10.2.15.6
    site-b.vcf.lab,result,A,10.2.15.7

[RESOURCES]
# hostname:maintenance_mode (no = exit maintenance mode during startup)
ESXiHosts = esx-01a.site-a.vcf.lab:no
  esx-02a.site-a.vcf.lab:no
  esx-03a.site-a.vcf.lab:no
  esx-04a.site-a.vcf.lab:no
  esx-01b.site-b.vcf.lab:no
  esx-02b.site-b.vcf.lab:no
  esx-03b.site-b.vcf.lab:no
  esx-04b.site-b.vcf.lab:no
  esx-05b.site-b.vcf.lab:no
  esx-06b.site-b.vcf.lab:no
  esx-07b.site-b.vcf.lab:no
  esx-08b.site-b.vcf.lab:no

# hostname:type:sso_user; the workload vCenter has its own SSO domain.
vCenters = vc-mgmt-a.site-a.vcf.lab:linux:administrator@vsphere.local
  vc-mgmt-b.site-b.vcf.lab:linux:administrator@vsphere.local
  vc-wld01-b.site-b.vcf.lab:linux:administrator@wld.sso

Datastores = VSAN:vsan-mgmt-01a
  VSAN:vsan-mgmt-01b
  VSAN:vsan-wld01-01b

# :on retains fully automated DRS; the core interprets :off as partially
# automated DRS, rather than disabling it. HA is not changed by these keys.
Clusters = cluster-mgmt-01a:on
  cluster-mgmt-01b:on
  cluster-wld01-01b:on

# vm_display_name:vcenter; vCenters have already been bootstrapped by VCF.py.
# SDDC Manager depends on Site B vCenter/NSX. The user VMs use VLAN 29 in A.
# vCLS VMs are managed automatically by vCenter and are not listed here.
# demo-002 is the Aria Automation demo deployment (demo-ubuntu-test-1028,
# Ubuntu 24.04, seg-01b 10.2.13.10); its NSX segment is up after VCF.py.
VMs = sddcmanager-b:vc-mgmt-b.site-b.vcf.lab
  user-vm-a:vc-mgmt-a.site-a.vcf.lab
  user-vm-b:vc-mgmt-a.site-a.vcf.lab
  demo-002:vc-mgmt-b.site-b.vcf.lab

Pings = 10.1.10.129
  10.1.10.130
  10.1.10.131
  10.1.10.150
  10.1.10.250
  10.1.1.1
  10.2.1.1
  10.1.1.10
  10.2.1.10
  10.2.1.11
  10.2.1.20
  10.2.1.21
  10.2.1.24
  10.2.1.25
  10.2.12.129
  10.2.12.136
  10.2.12.146
  10.2.12.151
  10.1.11.130
  10.1.11.131

TCPServices = vc-mgmt-a.site-a.vcf.lab:443
  vc-mgmt-b.site-b.vcf.lab:443
  vc-wld01-b.site-b.vcf.lab:443
  sddcmanager-b.site-b.vcf.lab:443
  nsx-mgmt-b.site-b.vcf.lab:443
  nsx-mgmt-01b.site-b.vcf.lab:443
  nsx-wld01-b.site-b.vcf.lab:443
  nsx-wld01-01b.site-b.vcf.lab:443
  opslcm-b.site-b.vcf.lab:443
  vidm-01b.site-b.vcf.lab:443
  user-vm-a.site-a.vcf.lab:22
  user-vm-b.site-a.vcf.lab:22
  offlinedepot.site-a.vcf.lab:443
  vcfinstaller-a.site-a.vcf.lab:443
  offlinedepot.site-a.vcf.lab:3000
  offlinedepot.site-a.vcf.lab:8080

# URL without an expected-text suffix checks HTTP 200. This avoids matching
# version-specific page titles while the lab is upgraded from 8.x / 5.2.1.
# No external web URL is required for the nested environment to be ready.
# Redirects are followed (e.g. NSX -> login.jsp, SDDC Manager -> vCenter SSO).
# Aria Automation is checked later, with a longer wait: [VCFFINAL] vraurls.
URLS = https://vc-mgmt-a.site-a.vcf.lab/ui/
  https://vc-mgmt-b.site-b.vcf.lab/ui/
  https://vc-wld01-b.site-b.vcf.lab/ui/
  https://sddcmanager-b.site-b.vcf.lab/ui/
  https://nsx-mgmt-b.site-b.vcf.lab/
  https://nsx-wld01-b.site-b.vcf.lab/
  https://opslcm-b.site-b.vcf.lab/
  https://vidm-01b.site-b.vcf.lab/SAAS/
  https://auth.vcf.lab/
  https://vcfinstaller-a.site-a.vcf.lab/
  http://offlinedepot.site-a.vcf.lab:3000/,Gitea

[VCF]
# Site B is currently 5.2.1 and has no Fleet appliance. Leave the 9.x-only
# vcf_version selector unset; Fleet products are explicitly empty below.

# The core's bootstrap-host key also covers the independent A and B workload
# clusters so their vCenters can be powered on before connecting to vCenter.
# VM lookup is host-agnostic; no vCenter or NSX VM is pinned to today's host.
vcfmgmtcluster = esx-01a.site-a.vcf.lab:esx
  esx-02a.site-a.vcf.lab:esx
  esx-03a.site-a.vcf.lab:esx
  esx-04a.site-a.vcf.lab:esx
  esx-01b.site-b.vcf.lab:esx
  esx-02b.site-b.vcf.lab:esx
  esx-03b.site-b.vcf.lab:esx
  esx-04b.site-b.vcf.lab:esx
  esx-05b.site-b.vcf.lab:esx
  esx-06b.site-b.vcf.lab:esx
  esx-07b.site-b.vcf.lab:esx
  esx-08b.site-b.vcf.lab:esx

vcfmgmtdatastore = vsan-mgmt-01a
  vsan-mgmt-01b
  vsan-wld01-01b

vcfnsxmgr = nsx-mgmt-01b
    nsx-wld01-01b
vcfnsxedges = edge-mgmt-01b
    edge-mgmt-02b
    edge-wld01-01b
    edge-wld01-02b
# Site B Aria VMs on the x-region NSX segment: they need the management
# Edges, so they start right after them, in VCF 5.x order (Suite Lifecycle,
# Workspace ONE Access, Automation). Starting Aria Automation this early gives
# its slow first boot time before [VCFFINAL] checks it. Shutdown stops them
# earlier, in reverse (Phase 1b, 11, 12); Phase 17c then finds them already
# powered off.
vcfpostedgevms = opslcm-b
    vidm-01b
    auto-01b

# Supervisor control plane VMs (SupervisorControlPlaneVM (1)-(3) in
# vc-wld01-b) are not listed here: vCenter/ESX Agent Manager starts them.
# They are covered by [VCFFINAL] tanzucontrol.

vcfvCenter = vc-mgmt-a
  vc-mgmt-b
  vc-wld01-b

vspvms =
sddcmanager = sddcmanager-b:vc-mgmt-b.site-b.vcf.lab

# No VVF or VVFFINAL section in this pre-upgrade baseline.

[VCFFINAL]
# Read by this repo's Startup/VCFfinal.py override (startup) and by the core
# Shutdown/VCFshutdown.py. See the note at the top of this file.

# Supervisor on the Site B workload cluster.
# Startup:  override Task 1 - make sure WCP is started (vCenter REST API) and
#           wait for the Supervisor to report RUNNING / READY.
# Shutdown: Phase 3 stops WCP, 3b pauses Supervisor clusters, 3c powers off
#           the control plane VMs, Phase 4 discovers remaining workload VMs.
tanzucontrol = SupervisorControlPlaneVM.*:vc-wld01-b.site-b.vcf.lab
tanzu_wait_minutes = 20
tanzu_required = false

# Aria Automation 8.18.1 (single node). Already started by vcfpostedgevms.
# Startup:  override Task 2 - power on if still off.
# Shutdown: Phase 1b - graceful guest shutdown through vCenter, first.
vravms = auto-01b:vc-mgmt-b.site-b.vcf.lab

# Aria Automation services. The shutdown wrapper stops them with
# "deploy.sh --shutdown", which removes them: after power-on they only come
# back when /opt/scripts/deploy.sh is run (20-40 min).
# Startup:  override Task 2b - wait for the appliance (up to
#           vra_node_wait_minutes), then start deploy.sh if no services exist.
# auto-01b:443 is therefore not in [RESOURCES] TCPServices: the port stays
# closed until deploy.sh has finished, and vraurls below covers it.
vra_start_hosts = auto-01b.site-b.vcf.lab
vra_node_wait_minutes = 15

# Aria Automation UI, checked after all other startup checks.
# Startup:  override Task 3 - wait up to vraurl_wait_minutes (covers deploy.sh).
vraurls = https://auto-01b.site-b.vcf.lab/
vraurl_wait_minutes = 60
vraurls_required = true

# VKS clusters. The core shutdown (Phase 3b) pauses every Cluster and the core
# startup never un-pauses it, so CAPI would stay frozen (no node remediation,
# no upgrades).
# Startup:  override Task 1b - un-pause paused clusters after the Supervisor
#           is ready (true by default; false turns it off).
vks_unpause = true

# Supervisor Services on the Site B workload Supervisor (domain-c9). Their
# pods are vSphere Pods that the Supervisor restarts on its own.
#   contour.tanzu.vmware.com          Contour 1.33.5 (Envoy LB 10.2.15.3)
#   harbor.tanzu.vmware.com           Harbor 2.15.2, https://harbor.site-b.vcf.lab
#   cci-ns.vmware.com                 Local Consumption Interface 9.1.3
#   argocd-service.vsphere.vmware.com Argo CD Service 1.3.0
# Startup:  override Task 4 - wait until each service is CONFIGURED.
supervisor_services = contour.tanzu.vmware.com
  harbor.tanzu.vmware.com
  cci-ns.vmware.com
  argocd-service.vsphere.vmware.com

# Kubernetes endpoints, "url,expected text".
#   Harbor (Envoy 10.2.15.3), Argo CD instance vks-demo/argocd-01 (10.2.15.5),
#   VKS cluster vks-demo/vks-01 API (10.2.15.4), voting app vote/result
#   (10.2.15.6 / 10.2.15.7, served by vks-01).
# Startup:  override Task 5 - runs last, wait up to k8s_wait_minutes.
# k8s_required = false: a failure is logged as a warning only; set it to true
# once the VKS exercises depend on these.
k8s_urls = https://harbor.site-b.vcf.lab/,Harbor
  https://argocd.site-b.vcf.lab/,Argo CD
  https://vks-01.site-b.vcf.lab:6443/livez,ok
  http://vote.site-b.vcf.lab/,Cats vs Dogs
  http://result.site-b.vcf.lab/,Cats vs Dogs
k8s_wait_minutes = 30
k8s_required = false

[SHUTDOWN]
# Empty values override the core's default VCF 9.x product lists.
# fleet_products stays empty: Site B 5.2.1 has no Fleet API, and Aria
# Automation is shut down by VM name below.
fleet_products =
vcf_ops_networks_vms =
vcf_ops_collector_vms =
vcf_ops_logs_vms =
vcf_ops_vms =

# Site B Aria products, graceful guest shutdown by VM name, in the reverse
# of the startup order and before the management Edges (Phase 14) remove
# their x-region network:
#   Phase 1b [VCFFINAL] vravms        -> auto-01b (Aria Automation)
#   Phase 11 vcf_identity_broker_vms -> vidm-01b (Workspace ONE Access)
#   Phase 12 vcf_ops_fleet_vms       -> opslcm-b (Aria Suite Lifecycle)
vcf_identity_broker_vms = vidm-01b
vcf_ops_fleet_vms = opslcm-b

# Read by this repo's Shutdown/Shutdown.py wrapper, before the core shutdown:
# stop the Aria Automation services with /opt/scripts/deploy.sh --shutdown
# so that Phase 1b only shuts down the guest OS. Timeout in seconds.
vra_prep_hosts = auto-01b.site-b.vcf.lab
vra_prep_timeout = 2700

# Shut down user VMs before management appliances and the ESX hosts.
# vm_patterns is empty: no Tanzu/VKS workload clusters exist yet; Phase 4
# also discovers Supervisor workload VMs dynamically. demo-002 (Aria
# Automation demo VM) is shut down here, before Aria Automation is stopped.
vm_patterns =
workload_vms = user-vm-a
  user-vm-b
  demo-002
sddc_manager_vms = sddcmanager-b

# NSX, vCenter and host shutdown lists are taken from [VCF] above.
esx_username = root
vsan_enabled = true
vsan_timeout = 2700
shutdown_hosts = true
